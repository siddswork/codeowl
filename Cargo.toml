[package]
name = "codeowl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Extracts a structural graph from a codebase and serves LLM-authored specs (the semantic layer) over MCP."
repository = "https://github.com/siddswork/codeowl"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
grep = "0.4.1"
ignore = "0.4.33"
notify = "8.2.0"
oxc_resolver = "11.24.3"
rmcp = { version = "3.2.0", features = ["transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3.11"
tree-sitter-typescript = "0.23.2"
